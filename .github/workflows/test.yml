name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ['latest', '0.7.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: talib
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: The action installed what it reported
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.talib.outputs.version }}'
          [ -n "$VERSION" ] || { echo "::error::the action produced no version output"; exit 1; }
          if [ '${{ matrix.version }}' != latest ]; then
            [ "$VERSION" = '${{ matrix.version }}' ] \
              || { echo "::error::asked for ${{ matrix.version }}, installed $VERSION"; exit 1; }
          fi
          case "$RUNNER_OS" in
            Linux)   PREFIX=/usr ;;
            macOS)   PREFIX=/usr/local ;;
            Windows) PREFIX='C:/ta-lib' ;;
            *)       echo "::error::unhandled $RUNNER_OS"; exit 1 ;;
          esac
          HEADER="$PREFIX/include/ta-lib/ta_libc.h"
          [ -f "$HEADER" ] || { echo "::error::$HEADER is missing"; exit 1; }
          echo "TA-Lib $VERSION, header at $HEADER"
